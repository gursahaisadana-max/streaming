<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ghost Wallet">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Ghost Wallet</title>
<!-- Icon and manifest links are filled in by JavaScript below -->
<link rel="apple-touch-icon" id="touchIcon" href="">
<link rel="icon" id="favIcon" href="">
<link rel="manifest" id="manifestLink" href="">
<style>
  /* ---------- Theme ---------- */
  :root {
    --bg: #000;
    --card: #121214;
    --pill: #17171a;
    --text: #fff;
    --muted: #9a9aa3;
    --accent: #5eead4;       /* mint accent */
    --accent-dark: #0d3b36;
    --green: #3ddc84;
    --red: #ff3b3b;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%;
    background: #000; color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
  svg { display: block; }

  /* ---------- App shell: max 430px, centered, full height ---------- */
  .app {
    position: relative; width: 100%; max-width: 430px;
    height: 100vh; height: 100dvh; margin: 0 auto;
    display: flex; flex-direction: column;
    background: var(--bg); overflow: hidden;
    padding-top: calc(var(--safe-top) + 8px);
  }

  /* Smooth tap animation for anything pressable */
  .tap { transition: transform .12s ease, opacity .12s ease, background .15s ease; }
  .tap:active { transform: scale(.95); opacity: .85; }

  /* ---------- Top row: avatar + pill tabs ---------- */
  .top { display: flex; align-items: center; gap: 8px; padding: 10px 16px 6px; }
  .avatar {
    width: 44px; height: 44px; border-radius: 50%; flex: none;
    background: linear-gradient(135deg, #ff9d6c, #ff6f91);
    display: grid; place-items: center;
  }
  .tab {
    height: 44px; padding: 0 20px; border-radius: 999px;
    background: var(--pill); color: #c9c9d1;
    font-size: 17px; font-weight: 600;
  }
  .tab.active { background: var(--accent); color: #04211e; }

  /* ---------- Scroll area ---------- */
  .scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 16px 24px; }

  /* ---------- Account + balance ---------- */
  .account {
    display: inline-flex; align-items: center; gap: 6px;
    margin-top: 18px; color: #d6d6dc; font-size: 17px; font-weight: 600;
  }
  .balance {
    display: block; margin-top: 4px;
    font-size: 58px; font-weight: 700; letter-spacing: -2px; line-height: 1.1;
    text-align: left;
  }
  .change-row { display: flex; align-items: center; gap: 10px; margin-top: 4px; font-size: 18px; font-weight: 700; }
  .change-pill { padding: 2px 8px; border-radius: 8px; font-size: 18px; color: #fff; }
  .up .change-amt { color: var(--green); }
  .up .change-pill { background: #12a150; }
  .down .change-amt { color: var(--red); }
  .down .change-pill { background: #e23030; }

  /* ---------- Send / Deposit pills ---------- */
  .wide-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 22px 0 18px; }
  .wide {
    height: 58px; border-radius: 999px; background: var(--pill);
    display: flex; align-items: center; justify-content: center; gap: 10px;
    font-size: 18px; font-weight: 600; color: #d6d6dc;
  }

  /* ---------- Cards ---------- */
  .row-card {
    display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
    background: var(--card); border-radius: 24px; padding: 16px 18px; margin-bottom: 12px;
  }
  .row-icon {
    width: 46px; height: 46px; border-radius: 50%; flex: none;
    background: #1d1d21; display: grid; place-items: center; color: #fff;
    font-weight: 700; font-size: 15px;
  }
  .row-main { flex: 1; min-width: 0; }
  .row-title { font-size: 19px; font-weight: 600; }
  .row-sub { font-size: 16px; color: var(--muted); margin-top: 2px; }
  .row-sub.accent { color: var(--accent); }
  .row-right { text-align: right; }
  .row-usd { font-size: 19px; font-weight: 600; }
  .row-chg { font-size: 15px; margin-top: 2px; }
  .up-text { color: var(--green); }
  .down-text { color: var(--red); }

  /* ---------- Promo card (dismissible) ---------- */
  .promo {
    position: relative; background: var(--card); border-radius: 28px;
    padding: 20px 20px 18px; margin: 18px 0 8px; overflow: hidden;
    transition: opacity .25s ease, transform .25s ease, max-height .3s ease, margin .3s ease, padding .3s ease;
    max-height: 260px;
  }
  .promo.hide { opacity: 0; transform: scale(.96); max-height: 0; margin: 0; padding-top: 0; padding-bottom: 0; }
  .promo-eyebrow { font-size: 13px; font-weight: 700; letter-spacing: .08em; color: var(--accent); }
  .promo-text { font-size: 24px; font-weight: 600; line-height: 1.25; margin: 10px 0 14px; max-width: 62%; }
  .promo-link { color: var(--accent); font-weight: 700; font-size: 17px; display: inline-flex; align-items: center; gap: 4px; }
  .promo-art { position: absolute; right: 18px; top: 50px; }
  .promo-close {
    position: absolute; top: 14px; right: 14px; width: 34px; height: 34px;
    border-radius: 50%; background: #222226; display: grid; place-items: center; color: #cfcfd6;
  }

  /* ---------- Tokens header ---------- */
  .section-title {
    display: flex; align-items: center; gap: 6px;
    font-size: 30px; font-weight: 700; margin: 26px 2px 12px;
  }

  /* ---------- Bottom dock: disclaimer + search + plus ---------- */
  .dock {
    padding: 6px 16px calc(10px + var(--safe-bottom));
    background: linear-gradient(to top, #000 70%, rgba(0,0,0,0));
  }
  .disclaimer { text-align: center; font-size: 11px; color: var(--muted); margin-bottom: 8px; }
  .dock-row { display: flex; gap: 12px; align-items: center; }
  .search {
    flex: 1; height: 58px; border-radius: 999px; background: #17171a;
    display: flex; align-items: center; gap: 12px; padding: 0 20px;
    color: var(--muted); font-size: 19px; text-align: left;
  }
  .plus {
    width: 58px; height: 58px; border-radius: 50%; flex: none;
    background: var(--accent); color: #04211e; display: grid; place-items: center;
  }

  /* ---------- Toast ---------- */
  .toast {
    position: absolute; left: 50%; top: calc(var(--safe-top) + 70px);
    transform: translate(-50%, -20px);
    background: #2a2a2f; color: #fff; padding: 10px 18px; border-radius: 999px;
    font-size: 14px; font-weight: 600; opacity: 0; pointer-events: none;
    transition: opacity .2s ease, transform .2s ease; z-index: 30; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- Bottom sheet ---------- */
  .backdrop {
    position: absolute; inset: 0; background: rgba(0,0,0,.65);
    opacity: 0; pointer-events: none; transition: opacity .25s ease; z-index: 20;
  }
  .backdrop.show { opacity: 1; pointer-events: auto; }
  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 25;
    background: #151518; border-radius: 28px 28px 0 0;
    padding: 12px 20px calc(20px + var(--safe-bottom));
    transform: translateY(105%); transition: transform .3s cubic-bezier(.2,.8,.2,1);
  }
  .sheet.show { transform: translateY(0); }
  .grabber { width: 40px; height: 4px; border-radius: 2px; background: #3a3a40; margin: 0 auto 16px; }
  .sheet h2 { margin: 0 0 16px; font-size: 22px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .field input {
    width: 100%; padding: 14px; font-size: 18px; background: #000; color: #fff;
    border: 1px solid #2a2a30; border-radius: 16px; outline: none;
  }
  .field input:focus { border-color: var(--accent); }
  .error { color: var(--red); font-size: 13px; min-height: 18px; margin-bottom: 8px; }
  .save {
    width: 100%; padding: 16px; border-radius: 999px;
    background: var(--accent); color: #04211e; font-weight: 700; font-size: 17px;
  }
</style>
</head>
<body>
<div class="app" id="app">

  <!-- Top row: avatar and pill tabs -->
  <header class="top">
    <div class="avatar" aria-label="Avatar">
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true">
        <circle cx="13" cy="13" r="9" fill="#fff" opacity=".95"/>
        <circle cx="10" cy="12" r="1.5" fill="#2a1a20"/>
        <circle cx="16" cy="12" r="1.5" fill="#2a1a20"/>
        <path d="M9.5 16c1.2 1.4 5.8 1.4 7 0" stroke="#2a1a20" stroke-width="1.4" fill="none" stroke-linecap="round"/>
      </svg>
    </div>
    <button class="tab active tap">Home</button>
    <button class="tab tap" data-toast="Demo only">Trade</button>
    <button class="tab tap" data-toast="Demo only">Explore</button>
  </header>

  <main class="scroll">
    <!-- Account name -->
    <button class="account tap" data-toast="Demo only">
      Account 1
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
    </button>

    <!-- Big balance (tap to edit) -->
    <button class="balance tap" id="balanceBtn" aria-label="Edit balance">$0.00</button>

    <!-- Daily change: amount and percent pill -->
    <div class="change-row up" id="changeRow">
      <span class="change-amt" id="changeAmt">+$0.00</span>
      <span class="change-pill" id="changePill">+0.00%</span>
    </div>

    <!-- Send / Deposit -->
    <section class="wide-actions">
      <button class="wide tap" data-toast="Demo only">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 3L3 10.5l7 3 3 7z"/></svg>
        Send
      </button>
      <button class="wide tap" data-toast="Demo only">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Deposit
      </button>
    </section>

    <!-- Cash card (a slice of the total balance) -->
    <button class="row-card tap" data-toast="Demo only">
      <div class="row-icon">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="3"/><circle cx="12" cy="12" r="2.5"/></svg>
      </div>
      <div class="row-main">
        <div class="row-title">Cash</div>
        <div class="row-sub accent">Earn 6% APY </div>
      </div>
      <div class="row-right"><div class="row-usd" id="cashUsd">$0.00</div></div>
    </button>

    <!-- Promo card with dismiss button -->
    <section class="promo" id="promo">
      <div class="promo-eyebrow">GHOST BOOST</div>
      <div class="promo-text">Turn on Boost to start earning on your balance</div>
      <button class="promo-link tap" data-toast="Demo only">
        Get Started
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
      </button>
      <!-- Original art: a mint coin with a bolt shape and sparkles -->
      <svg class="promo-art" width="120" height="120" viewBox="0 0 120 120" aria-hidden="true">
        <path d="M70 6L96 52 84 56 100 108 44 62 58 58z" fill="#2f5f58"/>
        <circle cx="48" cy="56" r="34" fill="#d7ff7a"/>
        <circle cx="48" cy="56" r="26" fill="none" stroke="#9ccf2e" stroke-width="3"/>
        <path d="M48 42a14 14 0 1 0 10 24" fill="none" stroke="#3b5a10" stroke-width="6" stroke-linecap="round"/>
        <path d="M48 56h14" stroke="#3b5a10" stroke-width="6" stroke-linecap="round"/>
        <path d="M100 30l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#d7ff7a"/>
        <path d="M92 84l2.5 5.5 5.5 2.5-5.5 2.5-2.5 5.5-2.5-5.5-5.5-2.5 5.5-2.5z" fill="#d7ff7a"/>
      </svg>
      <button class="promo-close tap" id="promoClose" aria-label="Dismiss">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </section>

    <!-- Tokens -->
    <h3 class="section-title">
      Tokens
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="color:#9a9aa3"><path d="M9 5l7 7-7 7"/></svg>
    </h3>
    <section id="tokenList"></section>
  </main>

  <!-- Bottom dock: always visible disclaimer, search bar, plus button -->
  <footer class="dock">
    <div class="disclaimer">Demo app. Not a real wallet. Balances are fake.</div>
    <div class="dock-row">
      <button class="search tap" data-toast="Demo only">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        Search Ghost
      </button>
      <button class="plus tap" data-toast="Demo only" aria-label="Add">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
  </footer>

  <!-- Toast, backdrop, edit sheet -->
  <div class="toast" id="toast" role="status"></div>
  <div class="backdrop" id="backdrop"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Edit balance">
    <div class="grabber"></div>
    <h2>Edit balance</h2>
    <div class="field">
      <label for="balInput">Total balance (USD)</label>
      <input id="balInput" type="text" inputmode="decimal" placeholder="12480.55" autocomplete="off">
    </div>
    <div class="field">
      <label for="pctInput">Daily change (%)</label>
      <input id="pctInput" type="text" inputmode="decimal" placeholder="-1.47" autocomplete="off">
    </div>
    <div class="error" id="error"></div>
    <button class="save tap" id="saveBtn">Save</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* ---------- Sample data ---------- */
  var CASH_WEIGHT = 0.10;
  var TOKENS = [
    { sym: "SOL",  name: "Solana",   color: "#7c4dff", weight: 0.38, price: 168.20,    chg: 3.42 },
    { sym: "USDC", name: "USD Coin", color: "#2775ca", weight: 0.20, price: 1.00,      chg: 0.01 },
    { sym: "ETH",  name: "Ethereum", color: "#5f6b8a", weight: 0.17, price: 3150.00,   chg: -1.15 },
    { sym: "JUP",  name: "Jupiter",  color: "#d99a1c", weight: 0.09, price: 0.92,      chg: 5.80 },
    { sym: "BONK", name: "Bonk",     color: "#e8742b", weight: 0.06, price: 0.0000245, chg: -4.60 }
  ];

  var STORAGE_KEY = "ghostWalletDemoV2";
  var state = { balance: 12480.55, pct: -1.47, promoHidden: false };

  /* ---------- Storage ---------- */
  function loadState() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      var d = JSON.parse(raw);
      if (isFinite(d.balance) && d.balance >= 0) state.balance = d.balance;
      if (isFinite(d.pct) && d.pct > -100) state.pct = d.pct;
      if (d.promoHidden === true) state.promoHidden = true;
    } catch (e) { /* use defaults */ }
  }
  function saveState() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch (e) { /* storage may be blocked */ }
  }

  /* ---------- Formatting ---------- */
  var usd = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD" });
  function fmtUsd(n) { return usd.format(n); }
  function fmtPct(n) { return (n >= 0 ? "+" : "") + n.toFixed(2) + "%"; }
  function fmtAmount(n) {
    if (n >= 1000) return n.toLocaleString("en-US", { maximumFractionDigits: 2 });
    if (n >= 1)    return n.toLocaleString("en-US", { maximumFractionDigits: 4 });
    return n.toLocaleString("en-US", { maximumFractionDigits: 6 });
  }
  function bigAmount(n) { return n >= 1e6 ? (n / 1e6).toFixed(2) + "M" : fmtAmount(n); }

  var $ = function (id) { return document.getElementById(id); };

  /* ---------- Render ---------- */
  function render() {
    $("balanceBtn").textContent = fmtUsd(state.balance);

    var prev = state.balance / (1 + state.pct / 100);
    var diff = state.balance - prev;
    var up = state.pct >= 0;
    $("changeRow").className = "change-row " + (up ? "up" : "down");
    $("changeAmt").textContent = (up ? "+" : "-") + fmtUsd(Math.abs(diff));
    $("changePill").textContent = fmtPct(state.pct);

    $("cashUsd").textContent = fmtUsd(state.balance * CASH_WEIGHT);

    var html = "";
    TOKENS.forEach(function (t) {
      var value = state.balance * t.weight;
      var amount = t.price > 0 ? value / t.price : 0;
      var amtText = (t.sym === "BONK" ? bigAmount(amount) : fmtAmount(amount)) + " " + t.sym;
      html +=
        '<button class="row-card tap" data-toast="Demo only">' +
          '<div class="row-icon" style="background:' + t.color + '">' + t.sym.charAt(0) + '</div>' +
          '<div class="row-main"><div class="row-title">' + t.name + '</div>' +
          '<div class="row-sub">' + amtText + '</div></div>' +
          '<div class="row-right"><div class="row-usd">' + fmtUsd(value) + '</div>' +
          '<div class="row-chg ' + (t.chg >= 0 ? "up-text" : "down-text") + '">' + fmtPct(t.chg) + '</div></div>' +
        '</button>';
    });
    $("tokenList").innerHTML = html;

    $("promo").classList.toggle("hide", state.promoHidden);
  }

  /* ---------- Toast ---------- */
  var toastTimer = null;
  function showToast(msg) {
    var t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("show"); }, 1400);
  }
  document.addEventListener("click", function (e) {
    var el = e.target.closest("[data-toast]");
    if (el) showToast(el.getAttribute("data-toast"));
  });

  /* ---------- Promo dismiss ---------- */
  $("promoClose").addEventListener("click", function () {
    state.promoHidden = true;
    saveState();
    $("promo").classList.add("hide");
  });

  /* ---------- Bottom sheet ---------- */
  function openSheet() {
    $("balInput").value = state.balance.toFixed(2);
    $("pctInput").value = String(state.pct);
    $("error").textContent = "";
    $("backdrop").classList.add("show");
    $("sheet").classList.add("show");
  }
  function closeSheet() {
    $("backdrop").classList.remove("show");
    $("sheet").classList.remove("show");
    $("balInput").blur();
    $("pctInput").blur();
  }
  function parseNum(text) {
    var cleaned = String(text).replace(/[$,\s]/g, "");
    return cleaned === "" ? NaN : Number(cleaned);
  }
  function onSave() {
    var bal = parseNum($("balInput").value);
    var pct = parseNum($("pctInput").value);
    if (!isFinite(bal) || bal < 0 || bal > 1e12) {
      $("error").textContent = "Enter a balance from 0 to 1,000,000,000,000.";
      return;
    }
    if (!isFinite(pct) || pct <= -100 || pct > 1000) {
      $("error").textContent = "Daily change must be above -100% and up to 1000%.";
      return;
    }
    state.balance = Math.round(bal * 100) / 100;
    state.pct = Math.round(pct * 100) / 100;
    saveState();
    render();
    closeSheet();
  }
  $("balanceBtn").addEventListener("click", openSheet);
  $("backdrop").addEventListener("click", closeSheet);
  $("saveBtn").addEventListener("click", onSave);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") closeSheet();
    if (e.key === "Enter" && $("sheet").classList.contains("show")) onSave();
  });

  /* ---------- Start ---------- */
  loadState();
  render();
})();
</script>

<script>
(function setupGhostIcons() {
  function createGhostIcon(size) {
    const canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext('2d');

    // 1. Periwinkle background (#a89cf7)
    ctx.fillStyle = '#a89cf7';
    ctx.fillRect(0, 0, size, size);

    // Scale drawing to a 100x100 grid
    ctx.save();
    ctx.scale(size / 100, size / 100);

    // 2. Ghost body (off-white #fbfbf8)
    ctx.fillStyle = '#fbfbf8';
    ctx.beginPath();
    // Top-right arch down to right side
    ctx.moveTo(48, 25);
    ctx.bezierCurveTo(68, 23, 81, 35, 81, 53);
    // Right-most tentacle lobe
    ctx.bezierCurveTo(81, 63, 76, 68, 70, 68);
    ctx.bezierCurveTo(65, 68, 63, 64, 62, 62);
    // Middle tentacle lobe
    ctx.bezierCurveTo(60, 69, 55, 73, 49, 73);
    ctx.bezierCurveTo(43, 73, 41, 68, 40, 66);
    // Left-most sweeping tail lobe
    ctx.bezierCurveTo(36, 74, 27, 78, 20, 74);
    ctx.bezierCurveTo(14, 70, 17, 58, 26, 46);
    // Left swooping back up to top arch
    ctx.bezierCurveTo(34, 35, 40, 26, 48, 25);
    ctx.closePath();
    ctx.fill();

    // 3. Two periwinkle eyes
    ctx.fillStyle = '#a89cf7';
    // Left eye
    ctx.beginPath();
    ctx.ellipse(58.5, 46, 3.8, 4.6, 0, 0, Math.PI * 2);
    ctx.fill();
    // Right eye
    ctx.beginPath();
    ctx.ellipse(69.5, 46, 3.8, 4.6, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
    return canvas.toDataURL('image/png');
  }

  const icon180 = createGhostIcon(180);
  const icon192 = createGhostIcon(192);
  const icon512 = createGhostIcon(512);

  // Set iOS Home Screen & Browser Favicon
  const touchIcon = document.getElementById('touchIcon');
  const favIcon = document.getElementById('favIcon');
  const manifestLink = document.getElementById('manifestLink');

  if (touchIcon) touchIcon.href = icon180;
  if (favIcon) favIcon.href = icon192;

  // Set Android / PWA Manifest
  if (manifestLink) {
    const manifest = {
      name: 'Ghost Wallet',
      short_name: 'Ghost',
      start_url: '.',
      display: 'standalone',
      background_color: '#000000',
      theme_color: '#a89cf7',
      icons: [
        { src: icon192, sizes: '192x192', type: 'image/png' },
        { src: icon512, sizes: '512x512', type: 'image/png' }
      ]
    };
    const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
    manifestLink.href = URL.createObjectURL(blob);
  }
})();
</script>
</body>
