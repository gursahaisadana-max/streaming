<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b10">
<title>Ghost Wallet (Demo)</title>
<style>
  /* ---------- Theme ---------- */
  :root {
    --bg: #0b0b10;
    --card: #15151d;
    --card-2: #1d1d28;
    --text: #f4f4f8;
    --muted: #8b8b9c;
    --accent: #7c6cf0;
    --green: #35d07f;
    --red: #ff5c6c;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  /* ---------- App shell: max 430px, centered, full height ---------- */
  .app {
    position: relative;
    width: 100%;
    max-width: 430px;
    height: 100vh;
    height: 100dvh;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    overflow: hidden;
    padding-top: var(--safe-top);
  }

  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }

  /* Smooth tap animation shared by all pressable things */
  .tap { transition: transform 0.12s ease, opacity 0.12s ease, background 0.12s ease; }
  .tap:active { transform: scale(0.94); opacity: 0.85; }

  /* ---------- Top bar ---------- */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px 4px;
  }
  .avatar {
    width: 38px; height: 38px; border-radius: 50%;
    background: linear-gradient(135deg, #ff9a6c, #ff6c9a);
    display: grid; place-items: center;
  }
  .account {
    display: flex; align-items: center; gap: 6px;
    font-weight: 600; font-size: 16px;
    padding: 8px 12px; border-radius: 999px;
  }
  .icon-row { display: flex; gap: 6px; }
  .icon-btn {
    width: 38px; height: 38px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--card);
  }
  svg { display: block; }

  /* ---------- Scroll area ---------- */
  .scroll {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 0 16px 16px;
  }

  /* ---------- Balance ---------- */
  .balance-wrap { text-align: center; padding: 24px 0 18px; }
  .balance {
    font-size: 46px; font-weight: 700; letter-spacing: -1px;
    padding: 4px 14px; border-radius: 16px;
    display: inline-block;
  }
  .change { margin-top: 4px; font-size: 16px; font-weight: 600; }
  .change.up { color: var(--green); }
  .change.down { color: var(--red); }

  /* ---------- Action buttons ---------- */
  .actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 22px; }
  .action { display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .action .circle {
    width: 56px; height: 56px; border-radius: 50%;
    background: var(--card-2);
    display: grid; place-items: center; color: var(--accent);
  }

  /* ---------- Token list ---------- */
  .section-title { font-size: 15px; font-weight: 600; margin: 0 4px 10px; color: var(--muted); }
  .token {
    display: flex; align-items: center; gap: 12px;
    width: 100%; text-align: left;
    background: var(--card);
    padding: 12px 14px; border-radius: 16px;
    margin-bottom: 10px;
  }
  .token-icon {
    width: 40px; height: 40px; border-radius: 50%;
    display: grid; place-items: center;
    font-weight: 700; font-size: 14px; color: #fff; flex: none;
  }
  .token-main { flex: 1; min-width: 0; }
  .token-name { font-weight: 600; font-size: 16px; }
  .token-amt { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .token-right { text-align: right; }
  .token-usd { font-weight: 600; font-size: 16px; }
  .token-chg { font-size: 13px; margin-top: 2px; }
  .up { color: var(--green); }
  .down { color: var(--red); }

  /* ---------- Footer: disclaimer + nav ---------- */
  .footer { background: var(--bg); border-top: 1px solid #1d1d28; padding-bottom: var(--safe-bottom); }
  .disclaimer {
    text-align: center; font-size: 11px; color: var(--muted);
    padding: 6px 12px 2px;
  }
  .nav { display: grid; grid-template-columns: repeat(5, 1fr); padding: 4px 6px 8px; }
  .nav-item {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    font-size: 11px; color: var(--muted); padding: 6px 0; border-radius: 12px;
  }
  .nav-item.active { color: var(--accent); }

  /* ---------- Toast ---------- */
  .toast {
    position: absolute; left: 50%; top: calc(var(--safe-top) + 70px);
    transform: translate(-50%, -20px);
    background: #2a2a38; color: var(--text);
    padding: 10px 18px; border-radius: 999px;
    font-size: 14px; font-weight: 600;
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    z-index: 30; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- Bottom sheet ---------- */
  .backdrop {
    position: absolute; inset: 0; background: rgba(0, 0, 0, 0.6);
    opacity: 0; pointer-events: none;
    transition: opacity 0.25s ease; z-index: 20;
  }
  .backdrop.show { opacity: 1; pointer-events: auto; }
  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0;
    background: var(--card);
    border-radius: 24px 24px 0 0;
    padding: 12px 20px calc(20px + var(--safe-bottom));
    transform: translateY(105%);
    transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    z-index: 25;
  }
  .sheet.show { transform: translateY(0); }
  .grabber { width: 40px; height: 4px; border-radius: 2px; background: #3a3a4a; margin: 0 auto 16px; }
  .sheet h2 { margin: 0 0 16px; font-size: 20px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .field input {
    width: 100%; padding: 14px; font-size: 18px;
    background: var(--bg); color: var(--text);
    border: 1px solid #2a2a38; border-radius: 14px; outline: none;
  }
  .field input:focus { border-color: var(--accent); }
  .error { color: var(--red); font-size: 13px; min-height: 18px; margin-bottom: 8px; }
  .save {
    width: 100%; padding: 15px; border-radius: 14px;
    background: var(--accent); color: #fff;
    font-weight: 700; font-size: 16px;
  }
</style>
</head>
<body>
<div class="app" id="app">

  <!-- Top bar: avatar, account name, search + settings icons -->
  <header class="topbar">
    <div class="avatar" aria-label="Avatar">
      <!-- Ghost Wallet logo: a simple ghost made with inline SVG -->
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 2c-4.4 0-7.5 3.2-7.5 7.6V21l2.6-2 2.4 2 2.5-2 2.5 2 2.4-2 2.6 2V9.6C19.5 5.2 16.4 2 12 2z" fill="#fff"/>
        <circle cx="9.2" cy="10" r="1.5" fill="#15151d"/>
        <circle cx="14.8" cy="10" r="1.5" fill="#15151d"/>
      </svg>
    </div>

    <button class="account tap" data-toast="Demo only">
      <span>Account 1</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
    </button>

    <div class="icon-row">
      <button class="icon-btn tap" data-toast="Demo only" aria-label="Search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      </button>
      <button class="icon-btn tap" data-toast="Demo only" aria-label="Settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
  </header>

  <main class="scroll">
    <!-- Big balance (tap to edit) and daily change -->
    <section class="balance-wrap">
      <button class="balance tap" id="balanceBtn" aria-label="Edit balance">$0.00</button>
      <div class="change up" id="change">+$0.00 +0.00%</div>
    </section>

    <!-- Action buttons: only show a toast -->
    <section class="actions">
      <button class="action tap" data-toast="Demo only">
        <span class="circle"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12M6 11l6 6 6-6M5 20h14"/></svg></span>Receive
      </button>
      <button class="action tap" data-toast="Demo only">
        <span class="circle"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>Send
      </button>
      <button class="action tap" data-toast="Demo only">
        <span class="circle"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v14M3 14l4 4 4-4M17 20V6M13 10l4-4 4 4"/></svg></span>Swap
      </button>
      <button class="action tap" data-toast="Demo only">
        <span class="circle"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>Buy
      </button>
    </section>

    <!-- Token list -->
    <h3 class="section-title">Tokens</h3>
    <section id="tokenList"></section>
  </main>

  <!-- Footer: always visible disclaimer + bottom nav -->
  <footer class="footer">
    <div class="disclaimer">Demo app. Not a real wallet. Balances are fake.</div>
    <nav class="nav">
      <button class="nav-item active tap">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home
      </button>
      <button class="nav-item tap" data-toast="Demo only">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v14M3 14l4 4 4-4M17 20V6M13 10l4-4 4 4"/></svg>Swap
      </button>
      <button class="nav-item tap" data-toast="Demo only">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>Apps
      </button>
      <button class="nav-item tap" data-toast="Demo only">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Activity
      </button>
      <button class="nav-item tap" data-toast="Demo only">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg>Explore
      </button>
    </nav>
  </footer>

  <!-- Toast, backdrop, and edit sheet -->
  <div class="toast" id="toast" role="status"></div>
  <div class="backdrop" id="backdrop"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Edit balance">
    <div class="grabber"></div>
    <h2>Edit balance</h2>
    <div class="field">
      <label for="balInput">Total balance (USD)</label>
      <input id="balInput" type="text" inputmode="decimal" placeholder="12480.55" autocomplete="off">
    </div>
    <div class="field">
      <label for="pctInput">Daily change (%)</label>
      <input id="pctInput" type="text" inputmode="decimal" placeholder="1.73" autocomplete="off">
    </div>
    <div class="error" id="error"></div>
    <button class="save tap" id="saveBtn">Save</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* ---------- Sample data ----------
     "weight" is the share of the total balance (weights add up to 1).
     "price" is a fake price per token, used only to compute the amount. */
  var TOKENS = [
    { sym: "SOL",  name: "Solana",   color: "#7c4dff", weight: 0.42, price: 168.20,     chg: 3.42 },
    { sym: "USDC", name: "USD Coin", color: "#2775ca", weight: 0.22, price: 1.00,       chg: 0.01 },
    { sym: "ETH",  name: "Ethereum", color: "#5f6b8a", weight: 0.18, price: 3150.00,    chg: -1.15 },
    { sym: "JUP",  name: "Jupiter",  color: "#e0a526", weight: 0.10, price: 0.92,       chg: 5.80 },
    { sym: "BONK", name: "Bonk",     color: "#e8742b", weight: 0.08, price: 0.0000245,  chg: -4.60 }
  ];

  var STORAGE_KEY = "ghostWalletDemo";
  var state = { balance: 12480.55, pct: 1.73 };   // defaults

  /* ---------- Storage (never breaks the app) ---------- */
  function loadState() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      var data = JSON.parse(raw);
      if (isFinite(data.balance) && data.balance >= 0) state.balance = data.balance;
      if (isFinite(data.pct) && data.pct > -100) state.pct = data.pct;
    } catch (e) { /* ignore: use defaults */ }
  }
  function saveState() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch (e) { /* ignore: storage may be blocked */ }
  }

  /* ---------- Formatting helpers ---------- */
  var usd = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD" });
  function fmtUsd(n) { return usd.format(n); }
  function fmtPct(n) { return (n >= 0 ? "+" : "") + n.toFixed(2) + "%"; }
  function fmtAmount(n) {
    if (n >= 1000) return n.toLocaleString("en-US", { maximumFractionDigits: 2 });
    if (n >= 1)    return n.toLocaleString("en-US", { maximumFractionDigits: 4 });
    return n.toLocaleString("en-US", { maximumFractionDigits: 6 });
  }
  function bigAmount(n) { // for tiny-price tokens like BONK
    return n >= 1e6 ? (n / 1e6).toFixed(2) + "M" : fmtAmount(n);
  }

  /* ---------- Rendering ---------- */
  var $ = function (id) { return document.getElementById(id); };

  function render() {
    // Big balance
    $("balanceBtn").textContent = fmtUsd(state.balance);

    // Daily change in dollars: total - (total / (1 + pct/100))
    var prev = state.balance / (1 + state.pct / 100);
    var diff = state.balance - prev;
    var up = state.pct >= 0;
    var el = $("change");
    el.className = "change " + (up ? "up" : "down");
    el.textContent = (up ? "+" : "-") + fmtUsd(Math.abs(diff)) + " " + fmtPct(state.pct);

    // Token rows: values are scaled so they add up to the total
    var html = "";
    TOKENS.forEach(function (t) {
      var value = state.balance * t.weight;
      var amount = t.price > 0 ? value / t.price : 0;
      var amtText = (t.sym === "BONK" ? bigAmount(amount) : fmtAmount(amount)) + " " + t.sym;
      html +=
        '<button class="token tap" data-toast="Demo only">' +
          '<div class="token-icon" style="background:' + t.color + '">' + t.sym.charAt(0) + '</div>' +
          '<div class="token-main"><div class="token-name">' + t.name + '</div>' +
          '<div class="token-amt">' + amtText + '</div></div>' +
          '<div class="token-right"><div class="token-usd">' + fmtUsd(value) + '</div>' +
          '<div class="token-chg ' + (t.chg >= 0 ? "up" : "down") + '">' + fmtPct(t.chg) + '</div></div>' +
        '</button>';
    });
    $("tokenList").innerHTML = html;
  }

  /* ---------- Toast ---------- */
  var toastTimer = null;
  function showToast(msg) {
    var t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("show"); }, 1400);
  }

  // One listener handles every element with data-toast
  document.addEventListener("click", function (e) {
    var target = e.target.closest("[data-toast]");
    if (target) showToast(target.getAttribute("data-toast"));
  });

  /* ---------- Bottom sheet ---------- */
  function openSheet() {
    $("balInput").value = state.balance.toFixed(2);
    $("pctInput").value = state.pct.toString();
    $("error").textContent = "";
    $("backdrop").classList.add("show");
    $("sheet").classList.add("show");
  }
  function closeSheet() {
    $("backdrop").classList.remove("show");
    $("sheet").classList.remove("show");
    $("balInput").blur();
    $("pctInput").blur();
  }

  // Parse a number from user text (allows commas and a leading $)
  function parseNum(text) {
    var cleaned = String(text).replace(/[$,\s]/g, "");
    if (cleaned === "") return NaN;
    return Number(cleaned);
  }

  function onSave() {
    var bal = parseNum($("balInput").value);
    var pct = parseNum($("pctInput").value);

    if (!isFinite(bal) || bal < 0 || bal > 1e12) {
      $("error").textContent = "Enter a balance between 0 and 1,000,000,000,000.";
      return;
    }
    if (!isFinite(pct) || pct <= -100 || pct > 1000) {
      $("error").textContent = "Daily change must be above -100% and up to 1000%.";
      return;
    }
    state.balance = Math.round(bal * 100) / 100;
    state.pct = Math.round(pct * 100) / 100;
    saveState();
    render();
    closeSheet();
  }

  $("balanceBtn").addEventListener("click", openSheet);
  $("backdrop").addEventListener("click", closeSheet);
  $("saveBtn").addEventListener("click", onSave);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") closeSheet();
    if (e.key === "Enter" && $("sheet").classList.contains("show")) onSave();
  });

  /* ---------- Start ---------- */
  loadState();
  render();
})();
</script>
</body>
</html>
